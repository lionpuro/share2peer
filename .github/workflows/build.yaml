name: Build and push image

on:
  push:
    branches:
      - main
    paths:
      - "backend/**"
      - ".github/workflows/build.yaml"
  workflow_dispatch:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup docker buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to Github Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build image and push it to registry
        run: |
          docker build \
            -t ghcr.io/lionpuro/websend-backend:${{ github.sha }} \
            -t ghcr.io/lionpuro/websend-backend:latest \
            backend
          docker push ghcr.io/lionpuro/websend-backend:${{ github.sha }}
          docker push ghcr.io/lionpuro/websend-backend:latest

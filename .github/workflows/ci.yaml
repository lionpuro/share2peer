name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read
  pull-requests: read

jobs:
  changes:
    name: Changes
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      workflows: ${{ steps.filter.outputs.workflows }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            backend:
              - 'backend/**'
            frontend:
              - 'frontend/**'
              - 'package*.json'
            workflows:
              - '.github/workflows/**'
  lint:
    needs: [changes]
    name: Lint
    uses: ./.github/workflows/lint.yaml
    secrets: inherit
    with:
      backend: ${{ github.event_name == 'workflow_dispatch' || needs.changes.outputs.workflows == 'true' || needs.changes.outputs.backend == 'true' }}
      frontend: ${{ github.event_name == 'workflow_dispatch' || needs.changes.outputs.workflows == 'true' || needs.changes.outputs.frontend == 'true' }}
  test:
    needs: [changes]
    name: Test
    uses: ./.github/workflows/test.yaml
    secrets: inherit
    with:
      backend: ${{ github.event_name == 'workflow_dispatch' || needs.changes.outputs.workflows == 'true' || needs.changes.outputs.backend == 'true' }}
      frontend: ${{ github.event_name == 'workflow_dispatch' || needs.changes.outputs.workflows == 'true' || needs.changes.outputs.frontend == 'true' }}
